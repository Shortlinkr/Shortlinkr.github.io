<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shortlinkr</title>
<style>
  body { font-family: sans-serif; text-align: center; max-width: 600px; margin: 50px auto; }
  input, button { padding: 10px; font-size: 16px; margin: 5px; }
  #result { margin-top: 20px; font-weight: bold; }
</style>
</head>
<body>
<h1>Shortlinkr</h1>
<form id="shortenForm">
  <input type="url" id="urlInput" placeholder="Enter long URL" required>
  <button type="submit">Shorten</button>
</form>
<div id="result"></div>

<script>
const WORKER_URL = "https://shortlinkr.caleb-martinez.workers.dev/";

document.getElementById("shortenForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const longUrl = document.getElementById("urlInput").value;
  const resultDiv = document.getElementById("result");

  try {
    const res = await fetch(`${WORKER_URL}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: longUrl })
    });

    if (!res.ok) throw new Error("Failed to shorten URL");

    const data = await res.json();
    resultDiv.innerHTML = `Short link: <a href="${data.short}" target="_blank">${data.short}</a>`;
  } catch (err) {
    resultDiv.textContent = "Error: " + err.message;
  }
});
</script>
</body>
</html>
